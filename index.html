        /* Nút hành động chính */
        .btn-action {
            background-color: #2bc486;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .btn-action:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);

        }
        .btn-action:active {
            transform: scale(0.96) translateY(0);
        }

            outline: none;
            border-radius: 0.5rem;
            padding: 4px 12px;
            transition: all 0.2s ease;
            cursor: text;
        }
        .editable-title:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .editable-title:focus {
            background-color: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 2px #2bc486;
        }

        /* Hiệu ứng số đếm ngược */
        #time-display {
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        #time-display:hover:not(.running) {
            transform: scale(1.03);
            text-shadow: 0 0 30px rgba(43, 196, 134, 0.5);
        }

        /* Hiệu ứng nhấp nháy khi hết giờ */
        @keyframes urgent-pulse {
            0%, 100% {
                color: #ff334b;
                transform: scale(1);
                text-shadow: 0 0 30px rgba(255, 51, 75, 0.8);
            }
            50% {
                color: #ffffff;
                transform: scale(1.08);
                text-shadow: 0 0 50px rgba(255, 51, 75, 1);
            }
        }
        .time-over {
            animation: urgent-pulse 0.7s infinite ease-in-out;
        }

        /* Input chỉnh thời gian */
        #time-input {
            font-family: inherit;
            background: rgba(0, 0, 0, 0.65);
            border: 3px solid #2bc486;
            outline: none;
            border-radius: 1.5rem;
            color: #d3f8e2;
            text-align: center;
            box-shadow: 0 0 35px rgba(43, 196, 134, 0.4);
        }

        /* Nút hỗ trợ góc màn hình */
        .corner-btn {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .corner-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: #2bc486;
            color: #2bc486;
        }

        /* Thanh Toggle Switch chuyển đổi Timer 1 & 2 */
        .toggle-container {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            padding: 4px;
            position: relative;
            display: inline-flex;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .toggle-pill {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: #2bc486;
            border-radius: 9999px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(43, 196, 134, 0.45);
            z-index: 1;
        }
        .toggle-pill.pos-2 {
            transform: translateX(100%);
        }
        .toggle-btn {
            position: relative;
            z-index: 2;
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.25s ease;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            background: transparent;
            outline: none;
        }
        @media (min-width: 768px) {
            .toggle-btn {
                padding: 10px 26px;
                font-size: 1rem;
            }
        }
        .toggle-btn.active {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .toggle-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.95);
        }
    </style>

<body class="h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden select-none">

    <!-- Nút tiện ích góc trên màn hình: Toàn màn hình & Phím tắt -->

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
        </button>
    </div>

    <!-- Nội dung chính -->
    <div class="z-10 flex flex-col items-center gap-3 md:gap-5 px-4 max-w-4xl w-full">
        
        <!-- Tiêu đề có thể tự điều chỉnh trực tiếp (Inline Edit) -->
        <div class="flex items-center gap-2 group">
            <h1 id="event-title" 
                class="editable-title text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold text-[#d3f8e2] tracking-wide text-center drop-shadow-md"
                contenteditable="true"

                title="Bấm vào để chỉnh sửa tiêu đề">

            <svg class="w-5 h-5 text-white/40 group-hover:text-[#2bc486] transition-colors pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        <div class="flex items-center justify-center relative w-full my-1 md:my-2">
            
            <!-- Nút điều chỉnh thời gian (+ / -) ở bên trái -->
            <div id="controls-panel" class="absolute left-[-3.5rem] sm:left-[-4.5rem] md:left-[-6.5rem] flex flex-col gap-3 md:gap-4 transition-all duration-300">
                <button id="btn-plus" class="text-[#2bc486] bg-black/40 hover:bg-black/60 border border-white/10 rounded-full w-12 h-12 md:w-16 md:h-16 flex items-center justify-center text-3xl md:text-5xl font-bold transition-all shadow-lg hover:scale-105 active:scale-95" title="Tăng 1 phút">+</button>

            <!-- Chế độ hiển thị đồng hồ (Bấm vào để nhập tùy ý) -->

        <div class="mt-3 md:mt-4 flex flex-col items-center">

    </div>

    <!-- Script điều khiển Logic -->
    <script>
        // Hỗ trợ lưu trữ an toàn trong iframe / Canva sandbox
        function saveStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn('Storage write disabled:', e);
            }
        }

        function getStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                console.warn('Storage read disabled:', e);
                return null;
            }
        }

        // Định nghĩa 2 bộ Timer cài đặt sẵn với dữ liệu độc lập
        const presets = {
            1: {
                id: 1,
                title: 'Pitching',
                defaultDuration: 5 * 60, // 5 phút
                configuredDuration: 5 * 60,
                remainingTime: 5 * 60,
                isRunning: false,
                timerId: null
            },
            2: {
                id: 2,
                title: 'Hỏi đáp cùng BGK',
                defaultDuration: 7 * 60, // 7 phút
                configuredDuration: 7 * 60,
                remainingTime: 7 * 60,
                isRunning: false,
                timerId: null
            }
        };

        // Khôi phục cài đặt từng preset từ localStorage nếu có
        [1, 2].forEach(id => {
            const savedTitle = getStorage('preset_' + id + '_title');
            if (savedTitle) presets[id].title = savedTitle;

            const savedDuration = getStorage('preset_' + id + '_duration');
            if (savedDuration) {
                const d = parseInt(savedDuration, 10);
                if (!isNaN(d) && d > 0) {
                    presets[id].configuredDuration = d;
                    presets[id].remainingTime = d;
                }
            }
        });

        // Preset đang kích hoạt hiện tại (1 hoặc 2)
        let activePresetId = 1;
        const savedActive = getStorage('active_preset_id');
        if (savedActive === '2') {
            activePresetId = 2;
        }

        let soundEnabled = true;

        // Lấy các phần tử DOM
        const eventTitle = document.getElementById('event-title');
        const timeDisplay = document.getElementById('time-display');
        const timeInput = document.getElementById('time-input');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        const controlsPanel = document.getElementById('controls-panel');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const btnSoundToggle = document.getElementById('btn-sound-toggle');
        const iconSoundOn = document.getElementById('icon-sound-on');
        const iconSoundOff = document.getElementById('icon-sound-off');
        const togglePill = document.getElementById('toggle-pill');
        const tabPreset1 = document.getElementById('tab-preset-1');
        const tabPreset2 = document.getElementById('tab-preset-2');
        const tabLabel1 = document.getElementById('tab-label-1');
        const tabLabel2 = document.getElementById('tab-label-2');

        // Định dạng số giây thành mm:ss
        function formatTime(totalSeconds) {
            const minutes = Math.floor(Math.max(0, totalSeconds) / 60);
            const seconds = Math.max(0, totalSeconds) % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Cập nhật nhãn trên thanh gạt toggle
        function updateTabLabels() {
            tabLabel1.textContent = `${presets[1].title} (${formatTime(presets[1].configuredDuration)})`;
            tabLabel2.textContent = `${presets[2].title} (${formatTime(presets[2].configuredDuration)})`;
        }

        // Khởi tạo AudioContext cho âm thanh chuông báo
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playAlarmSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                [0, 0.4, 0.8].forEach((delay) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + delay + 0.1);

                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.4, now + delay + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.35);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + delay);
                    osc.stop(now + delay + 0.35);
                });
            } catch (e) {
                console.warn('Audio play error:', e);
            }
        }

        function clearTimeOverEffect() {
            timeDisplay.classList.remove('time-over');
            timeDisplay.style.color = '#d3f8e2';
        }

        // Cập nhật toàn bộ giao diện theo preset đang chọn
        function syncUI() {
            const p = presets[activePresetId];
            eventTitle.textContent = p.title;
            timeDisplay.textContent = formatTime(p.remainingTime);

            if (p.isRunning) {
                btnStart.textContent = 'Tạm dừng';
                timeDisplay.classList.add('running');
                controlsPanel.style.opacity = '0';
                controlsPanel.style.pointerEvents = 'none';
            } else {
                if (p.remainingTime < p.configuredDuration && p.remainingTime > 0) {
                    btnStart.textContent = 'Tiếp tục';
                } else {
                    btnStart.textContent = 'Bắt đầu';
                }
                timeDisplay.classList.remove('running');
                controlsPanel.style.opacity = '1';
                controlsPanel.style.pointerEvents = 'auto';
            }

            if (p.remainingTime <= 0) {
                timeDisplay.classList.add('time-over');
            } else {
                clearTimeOverEffect();
            }

            // Cập nhật vị trí thanh gạt Toggle
            if (activePresetId === 1) {
                togglePill.classList.remove('pos-2');
                tabPreset1.classList.add('active');
                tabPreset2.classList.remove('active');
            } else {
                togglePill.classList.add('pos-2');
                tabPreset1.classList.remove('active');
                tabPreset2.classList.add('active');
            }

            updateTabLabels();
        }

        // Tạm dừng chạy của 1 preset (giữ nguyên số giây còn lại)
        function pausePreset(id) {
            const p = presets[id];
            if (p.timerId) {
                clearInterval(p.timerId);
                p.timerId = null;
            }
            p.isRunning = false;
        }

        // Chuyển đổi giữa 2 chế độ (chỉ dùng click chuột)
        function switchPreset(targetId) {
            if (targetId === activePresetId) return;

            // Tạm dừng bộ đếm cũ nếu đang chạy, nhưng lưu giữ nguyên số giây còn lại của nó
            pausePreset(activePresetId);

            activePresetId = targetId;
            saveStorage('active_preset_id', targetId.toString());

            // Đóng ô nhập nếu đang mở
            timeInput.classList.add('hidden');
            timeDisplay.classList.remove('hidden');

            syncUI();
        }

        tabPreset1.addEventListener('click', () => switchPreset(1));
        tabPreset2.addEventListener('click', () => switchPreset(2));

        // Tăng / Giảm thời gian cho preset hiện tại
        function adjustTime(minutesToAdd) {
            const p = presets[activePresetId];
            if (p.isRunning) return;

            let newDuration = p.configuredDuration + minutesToAdd * 60;
            if (newDuration < 10) newDuration = 10;
            if (newDuration > 99 * 60 + 59) newDuration = 99 * 60 + 59;

            p.configuredDuration = newDuration;
            p.remainingTime = newDuration;
            saveStorage('preset_' + activePresetId + '_duration', newDuration.toString());

            clearTimeOverEffect();
            syncUI();
        }

        // Xử lý nút Bắt đầu / Tạm dừng
        function toggleTimer() {
            getAudioContext();
            const p = presets[activePresetId];

            if (p.isRunning) {
                // Tạm dừng
                pausePreset(activePresetId);
                syncUI();
            } else {
                // Bắt đầu
                if (p.remainingTime <= 0) {
                    p.remainingTime = p.configuredDuration;
                }
                clearTimeOverEffect();

                p.isRunning = true;
                syncUI();

                p.timerId = setInterval(() => {
                    p.remainingTime--;
                    timeDisplay.textContent = formatTime(p.remainingTime);

                    if (p.remainingTime <= 0) {
                        pausePreset(activePresetId);
                        syncUI();
                        timeDisplay.classList.add('time-over');
                        playAlarmSound();
                    }
                }, 1000);
            }
        }

        // Xử lý nút Đặt lại (Reset) cho preset hiện tại
        function resetTimer() {
            const p = presets[activePresetId];
            pausePreset(activePresetId);
            p.remainingTime = p.configuredDuration;
            clearTimeOverEffect();
            syncUI();
        }

        // Bấm vào số để nhập thời gian tùy ý cho preset hiện tại
        timeDisplay.addEventListener('click', () => {
            const p = presets[activePresetId];
            if (p.isRunning) return;

            const m = Math.floor(p.configuredDuration / 60);
            const s = p.configuredDuration % 60;
            timeInput.value = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            timeDisplay.classList.add('hidden');
            timeInput.classList.remove('hidden');
            timeInput.focus();
            timeInput.select();
        });

        function commitCustomTime() {
            const p = presets[activePresetId];
            const raw = timeInput.value.trim();
            let parsedSeconds = 0;

            if (raw.includes(':')) {
                const parts = raw.split(':');
                const m = parseInt(parts[0], 10) || 0;
                const s = parseInt(parts[1], 10) || 0;
                parsedSeconds = m * 60 + s;
            } else {
                const val = parseInt(raw, 10);
                if (!isNaN(val)) {
                    parsedSeconds = val > 99 ? val : val * 60;
                }
            }

            if (parsedSeconds > 0) {
                if (parsedSeconds > 99 * 60 + 59) parsedSeconds = 99 * 60 + 59;
                p.configuredDuration = parsedSeconds;
                p.remainingTime = parsedSeconds;
                saveStorage('preset_' + activePresetId + '_duration', parsedSeconds.toString());
            }

            timeInput.classList.add('hidden');
            timeDisplay.classList.remove('hidden');
            clearTimeOverEffect();
            syncUI();
        }

        timeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                commitCustomTime();
            } else if (e.key === 'Escape') {
                timeInput.classList.add('hidden');
                timeDisplay.classList.remove('hidden');
            }
        });

        timeInput.addEventListener('blur', () => {
            commitCustomTime();
        });

        // Chỉnh sửa tiêu đề inline và lưu cho preset hiện tại
        eventTitle.addEventListener('blur', () => {
            const trimmed = eventTitle.textContent.trim();
            const p = presets[activePresetId];
            if (!trimmed) {
                eventTitle.textContent = activePresetId === 1 ? 'Pitching' : 'Hỏi đáp cùng BGK';
            }
            p.title = eventTitle.textContent.trim();
            saveStorage('preset_' + activePresetId + '_title', p.title);
            updateTabLabels();
        });

        eventTitle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                eventTitle.blur();
            }
        });

        // Bật / Tắt toàn màn hình
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        btnFullscreen.addEventListener('click', toggleFullscreen);

        // Bật / Tắt âm thanh chuông
        btnSoundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                iconSoundOn.classList.remove('hidden');
                iconSoundOff.classList.add('hidden');
            } else {
                iconSoundOn.classList.add('hidden');
                iconSoundOff.classList.remove('hidden');
            }
        });

        // Sự kiện các nút bấm
        btnStart.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);
        btnPlus.addEventListener('click', () => adjustTime(1));
        btnMinus.addEventListener('click', () => adjustTime(-1));

        // Phím tắt bàn phím
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === timeInput || document.activeElement === eventTitle) {
                return;
            }

            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.key.toLowerCase() === 'r') {
                e.preventDefault();
                resetTimer();
            } else if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        // Khởi tạo hiển thị lần đầu
        syncUI();
    </script>
</body>
</html>
